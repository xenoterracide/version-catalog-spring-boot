name: publish-ng
on:
  push:
    branches:
      - "**"
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    env:
      IS_PUBLISHING: true
    steps:
      - uses: actions/checkout@v6.0.0
        with:
          # head sha is always the latest commit but head branch has the name we need for publishing
          ref: ${{ github.event.workflow_run.head_branch }}
          filter: "blob:none"
          fetch-depth: 0
      # Ensure the remote default branch is set so tools relying on origin/HEAD behave consistently.
      - run: git remote set-head --auto origin
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5.0.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew publishAllPublicationsToGhRepository --info
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ secrets.GITHUB_ACTOR }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
