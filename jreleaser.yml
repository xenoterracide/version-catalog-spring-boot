release:
  github:
    owner: xenoterracide
    name: version-catalog-spring-boot

signing:
  active: ALWAYS
  armored: true
  mode: MEMORY

deploy:
  maven:
    github:
      github:
        active: ALWAYS
        url: https://maven.pkg.github.com/xenoterracide/version-catalog-spring-boot
        sign: true
        stagingRepositories:
          - build/repo
    mavenCentral:
      sonatype:
        active: NEVER
        url: https://central.sonatype.com/api/v1/publisher/deployments/maven2
        sign: true
        stagingRepositories:
          - build/repo
        retryDelay: 60
